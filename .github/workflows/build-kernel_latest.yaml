name: "Compile PS4-Linux Kernel-12xx; Unified Version: Latest"

on:
  workflow_dispatch:
  push:

jobs:
  build:
    env: 
        GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    steps: 
      # STEP 1: MUST CHECKOUT FIRST
      - name: Checkout ps4-linux-12xx repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: ${{ github.workspace }}/kernel-source-host
          ref: ${{ github.ref }}

      # STEP 2: SETUP CACHE VARS
      - name: Set up cache env vars
        id: cache-workspace-vars
        run: | 
          echo "CACHE_WORKSPACE_KEY=${{ runner.os }}-workspace-${{ github.run_id }}" >> $GITHUB_ENV
          echo "CACHE_WORKSPACE_RESTORE_KEY=${{ runner.os }}-workspace-${{ github.ref_name }}" >> $GITHUB_ENV

      # STEP 3: PREPARE FILES FOR DOCKER
      - name: Prepare Dockerfile and Config
        run: |
          # Copy Dockerfile to root for Buildx
          cp ${{ github.workspace }}/kernel-source-host/Dockerfile ./Dockerfile
          # Setup .config inside the source folder
          cd ${{ github.workspace }}/kernel-source-host
          if [ -f config ]; then
            mv config .config
            echo "Config moved to .config"
          fi

      - name: Set SUID to tar binary
        run: sudo chown root /bin/tar && sudo chmod u+s /bin/tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker Layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache 
          key: ${{ runner.os }}-docker-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # STEP 4: BUILD DOCKER IMAGE
      - name: Build Docker image
        run: |
          mkdir -p /tmp/.buildx-cache
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache,mode=max \
            --tag kernel-linux-ps4:latest \
            --load \
            .

      # STEP 5: COMPILE KERNEL INSIDE DOCKER
      - name: Compile the linux kernel
        id: compile-kernel-step
        run: |
          # Start the container
          docker run -i --name kernel -d \
            -v ${{ github.workspace }}/kernel-source-host:/container/workspace/kernel-source-container \
            -w /container/workspace/kernel-source-container \
            kernel-linux-ps4:latest tail -f /dev/null

          # Execute the build commands
          docker exec -i kernel bash <<'EOF'
          set -e
          
          # Setup directory variables
          export localversion=$(grep CONFIG_LOCALVERSION= .config | cut -d'"' -f2 | sed 's/-//')
          if [ -z "$localversion" ]; then localversion="ps4-custom"; fi
          
          export GCE_INSTALL_DIR=${PWD}/gce/install
          export MAKE_OPTS="-j$(nproc) HOSTCC=gcc-11 CC=gcc-11"

          mkdir -p ${GCE_INSTALL_DIR}/boot

          # Build Process
          make ${MAKE_OPTS} olddefconfig
          make ${MAKE_OPTS} bzImage
          make ${MAKE_OPTS} modules
          
          # Installation for Artifact
          make ${MAKE_OPTS} INSTALL_MOD_PATH=${GCE_INSTALL_DIR} modules_install
          cp arch/x86/boot/bzImage ${GCE_INSTALL_DIR}/boot/
          
          # Pack it up
          tar -cvzf /container/workspace/kernel-source-container/kernel_output.tar.gz -C ${GCE_INSTALL_DIR} .
          EOF
          
          echo "compile-kernel-complete=true" >> $GITHUB_OUTPUT

      # STEP 6: UPLOAD RESULTS
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-kernel-build
          path: ${{ github.workspace }}/kernel-source-host/kernel_output.tar.gz
